name: dbt setup
description: Install uv/python, sync locked project, install dbt deps, and materialize the Snowflake keypair into a temp key file.
inputs:
  project-path:
    description: Path to the dbt project (defaults to DBT_PROJECT_PATH env var).
    required: false
    default: dbt_openfood
runs:
  using: composite
  steps:
    - name: setup uv
      uses: astral-sh/setup-uv@v6

    - name: sync locked environment
      run: uv sync --frozen
      shell: bash

    - name: install dbt packages
      run: |
        PROJ="${DBT_PROJECT_PATH:-${{ inputs.project-path }}}"
        cd "$PROJ"
        uv run dbt deps
      shell: bash

    - name: write snowflake private key
      run: |
        if [ -n "${SNOWFLAKE_PRIVATE_KEY:-}" ]; then
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$RUNNER_TEMP/snowflake_key.p8"
          echo "SNOWFLAKE_KEY_PATH_D=$RUNNER_TEMP/snowflake_key.p8" >> "$GITHUB_ENV"
          echo "snowflake private key written"
        else
          echo "no SNOWFLAKE_PRIVATE_KEY provided"
        fi
      shell: bash