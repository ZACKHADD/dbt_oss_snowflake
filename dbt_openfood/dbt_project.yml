name: dbt_openfood

profile: snow_openfood

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

on-run-start:
  - "{{ show_project_configs() }}"


seeds:
  # Builds seeds into '<developer_name>_raw'

  dbt_openfood:
    +database: "{{ 'dev' if target.name == 'dev_sandbox' else target.name }}_sources_raw"
    +schema: 'OPENFOOD_API'

models:
  +database: "{{ 'dev' if target.name == 'dev_sandbox' else target.name }}_sources_raw"
  +schema: 'OPENFOOD_API'
  dbt_openfood:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    marts:
      +materialized: table
